services:
  demo-train:
    build: .
    image: credit-risk-system:local
    command: ["python", "-m", "scripts.run_demo"]
    volumes:
      - demo-artifacts:/app/artifacts/demo

  api:
    build: .
    image: credit-risk-system:local
    depends_on:
      demo-train:
        condition: service_completed_successfully
    environment:
      CREDIT_RISK_MODEL_DIR: /app/artifacts/demo/models
      CREDIT_RISK_LOG_PATH: /app/artifacts/demo/prediction_logs.jsonl
    volumes:
      - demo-artifacts:/app/artifacts/demo
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  dashboard:
    build: .
    image: credit-risk-system:local
    command: ["python", "-m", "streamlit", "run", "src/dashboard/app.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true", "--browser.gatherUsageStats=false"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      CREDIT_RISK_MODEL_DIR: /app/artifacts/demo/models
      CREDIT_RISK_LOG_PATH: /app/artifacts/demo/prediction_logs.jsonl
      CREDIT_RISK_API_URL: http://api:8000
    volumes:
      - demo-artifacts:/app/artifacts/demo
    ports:
      - "127.0.0.1:8501:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  demo-artifacts:
