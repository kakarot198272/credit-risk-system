name: Credit risk checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt -c requirements-linux.lock
      - run: python -m ruff check src scripts tests
      - run: python -m ruff format --check src scripts tests
      - run: python -m pytest -q
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d --wait api dashboard
      - run: curl --fail http://127.0.0.1:8000/ready
      - run: curl --fail http://127.0.0.1:8501/_stcore/health
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
